application:
  subdomain: parseable
  background_task: true
  multi_instance: false
  gpu_accel: false
  kvm_accel: false
  usb_accel: false
  public_path:
    - /
  routes:
    - /=http://parseable:8000/
  ingress:
    - protocol: tcp
      port: 8001
      service: parseable
    - protocol: tcp
      port: 8002
      service: parseable
services:
  parseable:
    # upstream: docker.io/parseable/parseable:v2.8.0
    image: registry.lazycat.cloud/czyt/parseable/parseable:c2eb2e378e49476e
    environment:
      - P_FS_DIR=/parseable/data
      - P_STAGING_DIR=/parseable/staging
    command: parseable local-store
    binds:
      - /lzcapp/var/data:/parseable/data
      - /lzcapp/var/staging:/parseable/staging
    setup_script: |
      chown -R 10001:10001 /parseable/data
      chown -R 10001:10001 /parseable/staging
